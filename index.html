<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kundenservice</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: #c90000;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    text-align: center;
    padding: 25px 18px;
}

.logo-image {
    width: min(38vw, 140px);
    height: min(38vw, 140px);
    object-fit: contain;
    display: block;
    margin: 0 auto 24px;
    border-radius: 12px;
}

h1 {
    color: #ffffff;
    font-size: clamp(25px, 7vw, 36px);
    line-height: 1.2;
    margin-bottom: 14px;
}

h2 {
    color: #ffffff;
    font-size: clamp(19px, 5vw, 25px);
    line-height: 1.3;
    margin-bottom: 24px;
}

p {
    color: #ffffff;
    font-size: clamp(16px, 4.5vw, 19px);
    line-height: 1.6;
}

.info-box {
    width: 100%;
    margin-top: 25px;
    padding: 22px 16px;
    background: rgba(0, 0, 0, 0.20);
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 14px;
}

.info-title {
    color: #ffffff;
    font-size: clamp(19px, 5vw, 23px);
    font-weight: bold;
    margin-bottom: 14px;
}

.footer {
    margin-top: 25px;
    color: #ffffff;
    font-size: 13px;
}

/* Kleine Smartphones */
@media (max-width: 380px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 20px 10px;
    }

    .logo-image {
        margin-bottom: 20px;
    }

    .info-box {
        padding: 18px 13px;
    }
}

/* Handy im Querformat */
@media (max-height: 500px) and (orientation: landscape) {
    body {
        align-items: flex-start;
        padding-top: 15px;
    }

    .container {
        padding-top: 10px;
    }

    .logo-image {
        width: 80px;
        height: 80px;
        margin-bottom: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Bilddatei im GitHub-Repository -->
    <img src="logo.png" alt="Logo" class="logo-image">

    <h1>
        Willkommen beim Kundenservice
    </h1>

    <h2>
        Bereich: Stornierungen
    </h2>

    <div class="info-box">

        <div class="info-title">
            Kundenservice
        </div>

        <p>
            Bitte nutzen Sie den Live-Support,
            um mit einem Mitarbeiter verbunden zu werden.
        </p>

    </div>


</div>
